name: Package Validation

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  validate:
    name: Shared package validation
    uses: Deucarian/Package-Registry/.github/workflows/deucarian-package-validation.yml@develop
    with:
      package-config: deucarian-package.json

  validate-catalog-projection:
    name: Validate installer catalog projection
    uses: Deucarian/Package-Registry/.github/workflows/deucarian-catalog-projection-check.yml@develop
    with:
      catalog: installer
      # Registry #150 reviews the typed API dependency graph for this feature branch.
      registry-ref: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/typed-api-catalogs' && '665a5a61f7fecc074499fda38d4f10d990539e5d' || 'develop' }}
